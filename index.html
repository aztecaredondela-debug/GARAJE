const AFF={
  amazonTags:{},   // un tag por tienda, p. ej. {"amazon.es":"tuid-21","amazon.com":"tuid-20"}
  ebayQuery:{},    // parámetros de eBay Partner Network, p. ej. {"ebay.es":"mkcid=1&mkrid=...&campid=...&toolid=10001&mkevt=1"}
  awin:{affid:"",mids:{"autodoc.es":"120163"}}  // affid = tu ID de editor en Awin; verifica el mid de Autodoc en tu panel
};

function aff(host,u){try{
  if(host.startsWith("amazon.")&&AFF.amazonTags[host])return u+"&tag="+encodeURIComponent(AFF.amazonTags[host]);
  if(host.startsWith("ebay.")&&AFF.ebayQuery[host])return u+"&"+AFF.ebayQuery[host];
  if(host.startsWith("autodoc.")&&AFF.awin.affid&&AFF.awin.mids[host])return "https://www.awin1.com/cread.php?awinmid="+AFF.awin.mids[host]+"&awinaffid="+encodeURIComponent(AFF.awin.affid)+"&ued="+encodeURIComponent(u);
}catch(e){}return u}

const toD=k=>mi()?k/1.609344:k,fromD=x=>+(mi()?x*1.609344:x).toFixed(1);
const toV=l=>S.cfg.units==="us"?l/3.785411784:l,fromV=x=>+(S.cfg.units==="us"?x*3.785411784:x).toFixed(3);

// almacén de documentos (IndexedDB)
let _db;const idb=()=>_db||(_db=new Promise((res,rej)=>{const r=indexedDB.open("garaje-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const putFile=async(id,b)=>{const d=await idb();return new Promise((res,rej)=>{const x=d.transaction("f","readwrite");x.objectStore("f").put(b,id);x.oncomplete=res;x.onerror=()=>rej(x.error)})};
const getFile=async id=>{const d=await idb();return new Promise((res,rej)=>{const r=d.transaction("f").objectStore("f").get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const delFile=async id=>{try{const d=await idb();d.transaction("f","readwrite").objectStore("f").delete(id)}catch(e){}};
async function storeFiles(list){const out=[];for(const f of list){
  if(f.size>25*1048576){alert(t("“{0}” pesa más de 25 MB y no se ha guardado.",f.name));continue}
  try{const id=uid();await putFile(id,f);out.push({id,name:f.name,type:f.type})}catch(e){alert(t("No se pudo guardar “{0}”.",f.name))}}return out}
async function openFile(id){try{const b=await getFile(id);if(!b){alert(t("No se encuentra el archivo en este dispositivo."));return}
  const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){alert(t("No se pudo abrir el archivo."))}}

const docsHtml=es=>{const d=es.flatMap(e=>(e.files||[]).map(f=>({e,f})));
  return `<h2>${t("Documentos")}</h2>`+(d.length?d.map(({e,f})=>`<button class="doc" data-a="file" data-id="${f.id}"><span style="font-size:26px">${fico(f)}</span><span><b>${esc(f.name)}</b><em>${ICO[e.type]} ${ty(e.type)} · ${fd(e.date)}</em></span></button>`).join(""):`<div class="empty">${t("Adjunta el recibo o las condiciones del seguro, la ficha de la ITV, facturas del taller… y los tendrás todos aquí.")}</div>`)};
// consumo
function consumo(es){
  const g=es.filter(e=>e.type==="gas"&&e.km&&e.liters).sort((a,b)=>a.km-b.km),segs=[];
  for(let i=1;i<g.length;i++){const d=g[i].km-g[i-1].km;if(d>0&&(!from||g[i].date>=from)&&(!to||g[i].date<=to))segs.push({date:g[i].date,d,l:g[i].liters,c:g[i].cost||0})}
  const K=segs.reduce((s,x)=>s+x.d,0),L=segs.reduce((s,x)=>s+x.l,0),C=segs.reduce((s,x)=>s+x.c,0);
  return{segs,K,L,C,l100:K?L/K*100:null,per100:K?C/toD(K)*100:null};
}
const odo=n=>String(Math.max(0,n)).padStart(6,"0").split("").map(d=>`<i>${d}</i>`).join("");
function gauge(l100){const max=l100&&l100>12?20:12,f=l100?Math.min(1,l100/max):0,L=188.5,v=ecoV(l100);
  return `<div class="gauge"><svg viewBox="0 0 140 84" role="img"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".6" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><path d="M10 74 A60 60 0 0 1 130 74" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="12" stroke-linecap="round"/>${f?`<path d="M10 74 A60 60 0 0 1 130 74" fill="none" stroke="url(#gg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L*f} ${L}"/>`:""}</svg><div class="gv"><span class="num">${v?num(v,1):"–"}</span><small>${ecoU()} · ${t("media")}</small></div></div>`}
function chart(es){const n=new Date(),out=[];
  for(let i=5;i>=0;i--){const ix=n.getMonth()-i,yy=n.getFullYear()+Math.floor(ix/12),mm=((ix%12)+12)%12,key=`${yy}-${String(mm+1).padStart(2,"0")}`;
    out.push({l:new Date(yy,mm,1).toLocaleDateString(S.cfg.lang,{month:"short"}),v:es.filter(e=>e.date.startsWith(key)).reduce((s,e)=>s+(e.cost||0),0)})}
  const mx=Math.max(...out.map(o=>o.v));if(!mx)return"";

 ok:b=>{S.entries.find(x=>x.id===b.dataset.id).status="done";save();render()},
 att:b=>{attId=b.dataset.id;$("#fa").click()},file:b=>openFile(b.dataset.id),
 rf:async b=>{if(!confirm(t("¿Quitar este documento?")))return;const e=S.entries.find(x=>x.id===b.dataset.id);e.files=e.files.filter(x=>x.id!==b.dataset.fid);await delFile(b.dataset.fid);save();render()},
 s:b=>{const e=S.entries.find(x=>x.id===b.dataset.id);openSearch(e.title||e.notes||"")},sg:()=>openSearch(""),part:b=>openSearch(b.dataset.id),
 go:()=>{const q=$("#pq").value.trim();if(q)openSearch(q)},f:b=>{filter=b.dataset.id;render()},
 cfg:()=>$("#dc").showModal(),exp:exportAll,imp:()=>$("#fi").click(),
 upk:()=>{const v=veh(),mk=Math.max(v.km0||0,...S.entries.filter(e=>e.vid===v.id).map(e=>e.km||0)),n=parseFloat(prompt(t("Kilometraje")+" ("+dU()+")",Math.round(toD(mk))));if(n>=0){S.entries.push({id:uid(),vid:v.id,type:"other",title:t("Actualizar kilometraje"),date:today(),km:fromD(n),cost:0});save();render()}},
 delv:()=>{const v=veh();if(!confirm(t("¿Eliminar el vehículo y todos sus registros?")))return;S.entries.filter(e=>e.vid===v.id).forEach(x=>(x.files||[]).forEach(f=>delFile(f.id)));S.entries=S.entries.filter(e=>e.vid!==v.id);S.vehicles=S.vehicles.filter(x=>x.id!==v.id);S.cur=S.vehicles[0]?S.vehicles[0].id:null;save();render()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&act[b.dataset.a])act[b.dataset.a](b)});
document.addEventListener("input",e=>{if(e.target.id==="sq")buildLinks()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pq")act.go()});
document.addEventListener("change",async e=>{const x=e.target;
  if(x.id==="t")sync();
  else if(x.id==="cf"){from=x.value;render()}else if(x.id==="ct"){to=x.value;render()}
  else if(x.dataset.set){S.cfg[x.dataset.set]=x.value;save();build();render()}
  else if(x.id==="vf")photoPick(x.files[0]);
  else if(x.id==="fa"){const en=S.entries.find(z=>z.id===attId);if(!en)return;const m=await storeFiles([...x.files]);en.files=(en.files||[]).concat(m);x.value="";save();render()}
  else if(x.id==="fi"&&x.files[0]){await importAll(x.files[0]);x.value=""}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,d=f.closest("dialog"),p=f.id==="fm"?saveEntry():f.id==="fv"?saveVeh():Promise.resolve();p.then(()=>d.close())});
if(!S.cur&&S.vehicles[0])S.cur=S.vehicles[0].id;
build();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
